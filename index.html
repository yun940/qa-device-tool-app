<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="0">
    <title>디바이스 대여/반납 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <link rel="stylesheet" href="css/style.css?v=38">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <script>
        (function(){
            try {
                if (localStorage.getItem('userAccessGranted') === '1') {
                    document.documentElement.classList.add('access-granted');
                }
            } catch(e){}
        })();
    </script>
</head>
<body>
        <!-- 접근 비밀번호 게이트 -->
        <div id="accessGate" class="access-gate">
            <div class="access-gate-card">
                <h1 class="access-gate-title">접근 비밀번호</h1>
                <p class="access-gate-desc">이용을 위해 비밀번호를 입력하세요.</p>
                <input id="accessGateInput" class="access-gate-input" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호">
                <div id="accessGateError" class="access-gate-error"></div>
                <button id="accessGateBtn" class="primary-btn access-gate-confirm">확인</button>
            </div>
        </div>

        <!-- 사이드바 오버레이 -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- 사이드바 -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <button id="sidebarClose" class="sidebar-close">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="4" y1="4" x2="16" y2="16"/>
                        <line x1="16" y1="4" x2="4" y2="16"/>
                    </svg>
                </button>
            </div>
            <ul class="sidebar-menu">
                <li class="admin-only"><button id="qrScanMenuBtn" class="sidebar-item">QR 인식</button></li>
                <li class="admin-only"><button id="addDeviceMenuBtn" class="sidebar-item">디바이스 추가</button></li>
                <li class="admin-only"><button id="clearSavedBtn" class="sidebar-item">저장 정보 초기화</button></li>
                <li class="admin-only"><a id="qrGenMenuBtn" class="sidebar-item" href="qr-generator.html">QR 생성기 (관리자)</a></li>
                <li class="sidebar-divider"></li>
                <li><button id="adminLoginMenuBtn" class="sidebar-item">관리자 로그인</button></li>
                <li class="admin-only"><button id="adminLogoutMenuBtn" class="sidebar-item">로그아웃</button></li>
            </ul>
        </nav>

        <!-- 헤더 -->
        <header class="header">
            <button id="hamburgerBtn" class="hamburger-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="header-status">
                <span id="roleBadge" class="role-badge role-general">일반</span>
                <span id="visitorBadge" class="visitor-badge" title="현재 접속 인원">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span id="visitorCount">-</span>
                </span>
            </div>
        </header>
    <div class="container">

        <!-- 메인 화면 (디바이스 현황) — 기본 화면 -->
        <div id="mainScreen" class="screen active">
            <div class="main-header">
                <h1 class="main-title">디바이스 현황</h1>
                <div class="main-header-actions">
                    <button id="selectModeBtn" class="icon-btn admin-only" aria-label="다중 선택" title="다중 선택">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="3"/>
                            <polyline points="8 12 11 15 16 9"/>
                        </svg>
                    </button>
                    <button id="refreshMainBtn" class="refresh-btn" aria-label="새로고침">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"/>
                            <polyline points="1 20 1 14 7 14"/>
                            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="search-bar">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input id="searchInput" type="text" placeholder="디바이스 이름 검색" autocomplete="off">
                <button id="searchClearBtn" class="search-clear" aria-label="검색어 지우기">
                    <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="4" y1="4" x2="16" y2="16"/>
                        <line x1="16" y1="4" x2="4" y2="16"/>
                    </svg>
                </button>
            </div>
            <div id="mainDeviceList" class="device-list-main">
                <div class="status-loading">불러오는 중...</div>
            </div>
            <div id="selectionBar" class="selection-bar">
                <div class="selection-info"><span id="selectedCount">0</span>개 선택됨</div>
                <div class="selection-actions">
                    <button id="bulkRentBtn" class="primary-btn sm">대여 <span id="bulkRentCount">0</span></button>
                    <button id="bulkReturnBtn" class="secondary-btn sm">반납 <span id="bulkReturnCount">0</span></button>
                </div>
            </div>
        </div>

        <!-- QR 스캔 화면 -->
        <div id="qrScanScreen" class="screen">
            <div class="main-header">
                <button id="backFromScanBtn" class="icon-btn icon-btn-back" aria-label="뒤로">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>
                <h1 class="main-title">QR 인식</h1>
                <div class="main-header-actions"></div>
            </div>
            <div class="qr-scan-body">
                <div class="qr-video-wrap">
                    <video id="qrVideo" playsinline muted autoplay></video>
                    <div class="qr-scan-frame"></div>
                </div>
                <p id="qrScanStatus" class="qr-scan-status">QR을 화면 중앙에 맞추면 자동 인식됩니다.</p>
            </div>
        </div>

        <!-- 디바이스 액션 모달 -->
        <div id="deviceActionModal" class="modal-overlay">
            <div class="modal-container modal-small">
                <div class="modal-header">
                    <h2 id="deviceActionTitle">디바이스</h2>
                    <button id="closeDeviceActionModal" class="modal-close">
                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="4" y1="4" x2="16" y2="16"/>
                            <line x1="16" y1="4" x2="4" y2="16"/>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="deviceActionInfo" class="device-action-info"></div>
                    <div id="deviceActionButtons" class="device-action-buttons"></div>
                </div>
            </div>
        </div>

        <!-- 대여 정보 입력 모달 (현황에서 대여 시) -->
        <div id="rentFromStatusModal" class="modal-overlay">
            <div class="modal-container modal-small">
                <div class="modal-header">
                    <h2>대여 정보 입력</h2>
                    <button id="closeRentFromStatusModal" class="modal-close">
                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="4" y1="4" x2="16" y2="16"/>
                            <line x1="16" y1="4" x2="4" y2="16"/>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="modalRenterName">이름</label>
                        <input type="text" id="modalRenterName" placeholder="이름을 입력하세요" autocomplete="off">
                    </div>
                    <label class="remember-name-option" for="rememberNameCheck">
                        <input type="checkbox" id="rememberNameCheck">
                        <span>다음부터 이름·셀 묻지 않고 바로 진행</span>
                    </label>
                    <div class="cell-rent-buttons">
                        <button id="rentCell1Btn" class="primary-btn">1셀 대여</button>
                        <button id="rentCell2Btn" class="primary-btn">2셀 대여</button>
                    </div>
                    <button id="cancelRentFromStatus" class="secondary-btn cancel-full">취소</button>
                </div>
            </div>
        </div>

        <!-- 디바이스 추가 모달 -->
        <div id="addDeviceModal" class="modal-overlay">
            <div class="modal-container modal-small">
                <div class="modal-header">
                    <h2>디바이스 추가</h2>
                    <button id="closeAddDeviceModal" class="modal-close">
                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="4" y1="4" x2="16" y2="16"/>
                            <line x1="16" y1="4" x2="4" y2="16"/>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="addDeviceCategory">카테고리</label>
                        <select id="addDeviceCategory" class="form-select">
                            <option value="" disabled selected>카테고리를 선택하세요</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="addDeviceName">디바이스명</label>
                        <input type="text" id="addDeviceName" placeholder="예: iPhone 16 Pro" autocomplete="off">
                    </div>
                    <div id="addDeviceError" class="login-error"></div>
                    <button id="addDeviceConfirmBtn" class="primary-btn login-confirm">추가</button>
                </div>
            </div>
        </div>

        <!-- 관리자 로그인 모달 -->
        <div id="adminLoginModal" class="modal-overlay">
            <div class="modal-container modal-small">
                <div class="modal-header">
                    <h2>관리자 로그인</h2>
                    <button id="closeAdminLoginModal" class="modal-close">
                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="4" y1="4" x2="16" y2="16"/>
                            <line x1="16" y1="4" x2="4" y2="16"/>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="adminPasswordInput">비밀번호</label>
                        <input type="password" id="adminPasswordInput" placeholder="관리자 비밀번호" autocomplete="current-password">
                    </div>
                    <div id="adminLoginError" class="login-error"></div>
                    <button id="adminLoginConfirmBtn" class="primary-btn login-confirm">로그인</button>
                </div>
            </div>
        </div>

        <!-- 로딩 오버레이 -->
        <div id="loadingOverlay" class="loading-overlay">
            <div class="loading-spinner"></div>
            <p>처리 중...</p>
        </div>
    </div>

    <script src="js/config.js?v=38"></script>
    <script src="js/access-gate.js?v=38"></script>
    <script src="js/app.js?v=38"></script>
</body>
</html>
